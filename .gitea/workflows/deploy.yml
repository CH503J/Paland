name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        run: |
          git clone http://192.168.101.100:3000/root/PaLand.git .

      - name: 构建镜像
        run: docker build -t paland:latest .

      - name: 停止旧容器并启动新容器
        run: |
          docker stop paland || true
          docker rm paland || true
          docker run -d \
            --name paland \
            --restart always \
            -p 18888:18888 \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            -e SPRING_PROFILES_ACTIVE=prod \
            paland:latest